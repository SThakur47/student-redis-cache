# =============================================
# APPLICATION NAME
# =============================================
spring.application.name=student-redis-cache

# =============================================
# PostgreSQL DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/studentdb
spring.datasource.username=${DB_PASSWORD:yourpassword}
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
# update = auto-creates/updates tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# REDIS CONFIGURATION
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=yourredispassword  # Uncomment if auth enabled
spring.data.redis.timeout=2000ms

# =============================================
# SPRING CACHE
# =============================================
spring.cache.type=redis
spring.cache.redis.time-to-live=300s
 # 5 minutes TTL (in milliseconds)
spring.cache.redis.cache-null-values=false

# =============================================
# SERVER PORT
# =============================================
server.port=8080
